
url:                  "https://api.yourhead.com"
baseurl:              "https://yourhead.github.io/StacksAPI"
reloader:             NO
github:               [Repository metadata]


# Everything below here should be identical in both local and github setups

safe:                true      # enable safe mode to match github pages
permalink:           pretty    # make pretty link
relative_permalinks: false
highlighter:         rouge

title:               Stacks API
tagline:             Come build with us.
version:             13
stacksVersion:       5.0
author:
  name:              YourHead Software
  url:               http://yourhead.com


git_host:            github.com
git_host_user:       yourhead
git_project:         StacksAPI
git_branch:          gh-pages



# sass needs to be setup for some lame reason
sass:
  sass_dir:          _sass
  style:             :compressed


# Collections -- seriously, couldn't this just the be default
collections:
  keys:
      output: true
  controls:
      output: true
  templates:
      output: true
  

# Default layouts for various things
defaults:
  - scope:
      path: "themes"
    values:
      api_section: theme
  - scope:
      path: ""
      type: "controls"
    values:
      api_section: stack
      layout: "control"
      back: 
        - plist: "controls"
      layout: "control"
  - scope:
      path: ""
      type: "keys"
    values:
      api_section: stack
      layout: "key"
      back: 
        - top: "/plist"
  - scope:
      path: ""
      type: "templates"
    values:
      api_section: stack
      layout: "template"
      back: 
        - top: "/templates"
